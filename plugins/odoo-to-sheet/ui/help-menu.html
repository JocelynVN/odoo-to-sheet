<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chọn nội dung hướng dẫn</title>
    <style>
      :root { color-scheme: light dark; font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --line: color-mix(in srgb, currentColor 18%, transparent); --muted: color-mix(in srgb, currentColor 68%, transparent); --accent: #8064a2; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 22px; }
      main { max-width: 680px; margin: 0 auto; }
      h1 { margin: 0 0 6px; font-size: 22px; }
      .intro { margin: 0 0 18px; color: var(--muted); }
      #choices { display: grid; gap: 10px; }
      button { width: 100%; padding: 13px 15px; border: 1px solid var(--line); border-radius: 11px; background: transparent; color: inherit; text-align: left; font: inherit; cursor: pointer; transition: background .12s ease, border-color .12s ease; }
      button:hover, button:focus-visible { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); outline: 2px solid var(--accent); outline-offset: 1px; }
      button:disabled { opacity: .58; cursor: progress; }
      button strong { display: block; font-size: 15px; }
      button span { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
      #status { min-height: 22px; margin-top: 12px; color: var(--muted); font-size: 13px; }
      .cancel { margin-top: 8px; width: auto; padding: 8px 12px; }
      @media (max-width: 520px) { body { padding: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Bạn cần hỗ trợ việc nào?</h1>
      <p class="intro">Chọn một mục để Odoo To Sheet tiếp tục hướng dẫn hoặc thực hiện theo yêu cầu của bạn.</p>
      <div id="choices" aria-label="Các lựa chọn hướng dẫn"></div>
      <div id="status" role="status" aria-live="polite"></div>
      <button class="cancel" id="cancel" type="button">Đóng</button>
    </main>
    <script>
      const CHOICES = [
        { title: "Kết nối Odoo hoặc sửa lỗi đăng nhập", detail: "Bắt đầu cấu hình hoặc nhập lại thông tin xác thực bị lỗi.", prompt: "Tôi chọn hướng dẫn kết nối Odoo lần đầu hoặc sửa lỗi đăng nhập. Hãy tiếp tục theo skill /odoo2sheet-start." },
        { title: "Xuất báo cáo bán hàng thành CSV", detail: "Chọn bộ lọc và các cột cho báo cáo sale.report.", prompt: "Tôi muốn xuất báo cáo bán hàng thành CSV. Hãy tiếp tục theo skill /odoo2sheet-salereport." },
        { title: "Đổi hồ sơ Odoo, database hoặc thư mục lưu CSV", detail: "Xem hồ sơ đã lưu và cập nhật lựa chọn bạn yêu cầu.", prompt: "Tôi chọn hướng dẫn chọn hồ sơ Odoo, đổi database hoặc thư mục lưu CSV. Hãy tiếp tục theo hướng dẫn mục 3 của skill /odoo2sheet-help; đừng mở lại hộp lựa chọn." },
        { title: "Cập nhật plugin Odoo To Sheet", detail: "Kiểm tra nguồn cài đặt và cách cập nhật phù hợp.", prompt: "Tôi muốn cập nhật plugin Odoo To Sheet. Hãy tiếp tục theo skill /odoo2sheet-upgrade." },
        { title: "Sao lưu, xóa dữ liệu cục bộ hoặc gỡ plugin", detail: "Xem trước dữ liệu, yêu cầu xác nhận sao lưu rồi mới dọn.", prompt: "Tôi muốn sao lưu, xóa dữ liệu cục bộ hoặc gỡ plugin. Hãy tiếp tục theo skill /odoo2sheet-uninstall." },
        { title: "Hướng dẫn khác", detail: "Hỏi về URL Odoo, API key, database hoặc nhu cầu khác.", prompt: "Tôi cần hướng dẫn khác về Odoo To Sheet. Hãy hỏi ngắn gọn tôi đang cần làm gì." },
      ];
      const pending = new Map();
      let nextRequestId = 1;
      const status = document.getElementById("status");

      function request(method, params) {
        const id = nextRequestId++;
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0" || message.id === undefined) return;
        const item = pending.get(message.id);
        if (!item) return;
        pending.delete(message.id);
        if (message.error) item.reject(message.error);
        else item.resolve(message.result);
      }, { passive: true });

      const bridgeReady = request("ui/initialize", {
        appInfo: { name: "odoo2sheet-help-menu", version: "1.0.0" },
        appCapabilities: {},
        protocolVersion: "2026-01-26",
      }).then(() => {
        window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*");
      });

      async function sendChoice(prompt) {
        await bridgeReady;
        const result = await request("ui/message", {
          role: "user",
          content: [{ type: "text", text: prompt }],
        });
        if (result?.isError) throw new Error("The host rejected the selected option.");
        try { await window.openai?.requestClose?.(); } catch {}
      }

      for (const choice of CHOICES) {
        const button = document.createElement("button");
        button.type = "button";
        const title = document.createElement("strong");
        title.textContent = choice.title;
        const detail = document.createElement("span");
        detail.textContent = choice.detail;
        button.append(title, detail);
        button.addEventListener("click", async () => {
          document.querySelectorAll("#choices button, #cancel").forEach((item) => { item.disabled = true; });
          status.textContent = "Đang gửi lựa chọn về hội thoại…";
          try {
            await sendChoice(choice.prompt);
            status.textContent = "Đã gửi lựa chọn. Bạn có thể tiếp tục trong hội thoại.";
          } catch {
            document.querySelectorAll("#choices button, #cancel").forEach((item) => { item.disabled = false; });
            status.textContent = "Chưa gửi được lựa chọn. Hãy thử lại hoặc trả lời trực tiếp trong chat.";
          }
        });
        document.getElementById("choices").append(button);
      }

      document.getElementById("cancel").addEventListener("click", () => window.openai?.requestClose?.());
    </script>
  </body>
</html>
